name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  standalone-exe:
    name: Standalone gateway (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install pkg
        run: npm install -g pkg@5
      - name: Build standalone executable
        run: pkg server/index.js --targets node18-win-x64 --output dist/llm-aggregator.exe --icon icon.ico
      - name: Assemble distributable
        run: |
          cd dist
          copy ..\config.json .
          copy ..\prefs.json .
          copy ..\pricing.json .
          xcopy ..\panel panel\ /E /I /Y
          xcopy ..\server server\ /E /I /Y
      - name: Zip distributable
        run: Compress-Archive -Path dist\* -DestinationPath llm-aggregator-win.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llm-aggregator-win
          path: llm-aggregator-win.zip
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || (github.ref_type == 'tag' && github.ref_name) || format('build-{0}', github.run_number) }}
          name: LLM Aggregator ${{ github.event.inputs.version || (github.ref_type == 'tag' && github.ref_name) || format('build-{0}', github.run_number) }}
          files: llm-aggregator-win.zip
          generate_release_notes: true

  desktop-app:
    name: Tauri desktop installer (.exe / .msi)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri CLI
        run: npm install
      - name: Tauri build
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/*.exe
