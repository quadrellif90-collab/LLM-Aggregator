<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Aggregator Widget</title>
  <style>
    * { box-sizing: border-box; }
    body { font: 13px system-ui, sans-serif; background: #161a21; color: #e6e6e6; margin: 0; padding: 10px; border-radius: 10px; min-height: 200px; display: flex; flex-direction: column; gap: 6px; }
    #q { width: 100%; height: 70px; background: #0c0f14; color: #e6e6e6; border: 1px solid #2a3140; border-radius: 8px; padding: 6px; resize: vertical; font-family: inherit; font-size: inherit; }
    #askBtn { background: #3b82f6; color: #fff; border: 0; border-radius: 8px; padding: 6px 12px; cursor: pointer; align-self: flex-start; }
    #askBtn:disabled { opacity: 0.5; cursor: not-allowed; }
    #a { background: #0c0f14; border: 1px solid #2a3140; border-radius: 8px; padding: 6px; flex: 1; overflow-y: auto; white-space: pre-wrap; word-break: break-word; margin: 0; min-height: 40px; font-size: 12px; }
    .err { color: #f87171; }
  </style>
</head>
<body>
  <textarea id="q" placeholder="Quick ask…"></textarea>
  <button id="askBtn" onclick="ask()">Ask</button>
  <pre id="a">—</pre>
  <script>
    let gatewayKey = '';

    async function checkAuth() {
      try {
        const r = await fetch('/hub/state');
        if (r.status === 200) return;
        if (r.status === 401) {
          const j = await r.json();
          if (j.tokenRequired) {
            gatewayKey = prompt('Gateway token required. Enter your control token:');
            if (!gatewayKey) document.getElementById('a').textContent = 'Token required to use the widget.';
          }
        }
      } catch (e) {
        document.getElementById('a').textContent = 'Gateway offline.';
      }
    }

    async function ask() {
      const btn = document.getElementById('askBtn');
      const out = document.getElementById('a');
      const q = document.getElementById('q').value.trim();
      if (!q) return;
      btn.disabled = true;
      out.textContent = '…';
      try {
        const headers = { 'content-type': 'application/json' };
        if (gatewayKey) headers['Authorization'] = 'Bearer ' + gatewayKey;
        const r = await fetch('/v1/chat/completions', { method: 'POST', headers, body: JSON.stringify({ model: 'auto', stream: false, messages: [{ role: 'user', content: q }] }) });
        const j = await r.json();
        if (!r.ok) { out.textContent = 'Error ' + r.status + ': ' + (j.error && j.error.message || JSON.stringify(j)); out.className = 'err'; return; }
        out.textContent = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || JSON.stringify(j, null, 2);
        out.className = '';
      } catch (e) {
        out.textContent = e.message; out.className = 'err';
      } finally {
        btn.disabled = false;
      }
    }

    document.getElementById('q').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); } });
    checkAuth();
  </script>
</body>
</html>
